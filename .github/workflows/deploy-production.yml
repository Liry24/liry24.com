name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liry24-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Workers and CIMD container
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application
        run: |
          bun run lint
          bun run typecheck
          bun run cimd-fetcher:typecheck
          bun test
          bun run db:generate
          git diff --exit-code -- drizzle

      - name: Build Worker
        run: bun run build

      - name: Deploy CIMD container Worker
        run: bunx wrangler deploy --config workers/cimd-fetcher/wrangler.jsonc --keep-vars

      - name: Deploy application Worker
        run: bunx wrangler deploy --config .output/server/wrangler.json --keep-vars
