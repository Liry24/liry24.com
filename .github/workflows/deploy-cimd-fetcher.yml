name: Deploy CIMD fetcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cimd-fetcher.yml
      - bun.lock
      - package.json
      - workers/cimd-fetcher/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liry24-cimd-fetcher-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy CIMD fetcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check CIMD fetcher
        run: bun run cimd-fetcher:typecheck

      - name: Deploy CIMD container Worker
        run: bunx wrangler deploy --config workers/cimd-fetcher/wrangler.jsonc --keep-vars
