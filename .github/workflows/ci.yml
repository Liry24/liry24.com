name: Validate

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Type check CIMD fetcher
        run: bun run cimd-fetcher:typecheck

      - name: Run tests
        run: bun test

      - name: Verify generated database migration state
        run: |
          bun run db:generate
          git diff --exit-code -- drizzle

      - name: Build Worker
        run: bun run build

      - name: Build CIMD container image
        run: docker build --file workers/cimd-fetcher/Dockerfile --tag liry24-cimd-fetcher:${{ github.sha }} workers/cimd-fetcher
